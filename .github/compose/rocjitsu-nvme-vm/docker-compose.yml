---
# rocjitsu GPU + QEMU VM stack for rocm-xio LBA NVMe testing.
#
# Brings up a rocjitsu vfio-user GPU server alongside a qemu-system VM with
# one QEMU-emulated NVMe disk (--nvme 1).  No SPDK container is needed: the
# NVMe controller is provided by QEMU's built-in nvme emulation, which
# supports direct doorbell access from the GPU kernel via BAR0 mmap.
#
# Every image is pinned to a dated tag. Do not use :latest here.
#
# Usage (normally driven by .github/actions/rocjitsu-nvme-vm):
#   cp env.example .env && $EDITOR .env
#   docker compose up --detach

services:
  rocjitsu:
    image: "${ROCJITSU_IMAGE:?ROCJITSU_IMAGE must be set to a pinned tag}"
    volumes:
      - vfu-sockets:/run/vfu
    restart: on-failure
    command:
      - rocjitsu
      - --config
      - "/usr/local/share/rocjitsu/configs/${ROCJITSU_CONFIG:-gfx1250_mi455x.json}"
      - --vfio-socket
      - /run/vfu/rocjitsu.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/rocjitsu.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  qemu:
    image: "${QEMU_IMAGE:?QEMU_IMAGE must be set to a pinned tag}"
    depends_on:
      rocjitsu:
        condition: service_healthy
    volumes:
      - vfu-sockets:/run/vfu:ro
      - "${VM_IMAGES_DIR:?VM_IMAGES_DIR must be set}:${VM_IMAGES_DIR}"
    devices:
      - /dev/kvm
    shm_size: "${VM_SHM_SIZE:-12g}"
    ports:
      - "${VM_SSH_PORT:-2222}:2222"
    entrypoint:
      - qemu-tool
      - run-vm
    command:
      - --images
      - "${VM_IMAGES_DIR}"
      - --vm-name
      - "${VM_NAME:-batesste-ci-vm}"
      - --vcpus
      - "${VM_VCPUS:-4}"
      - --vmem
      - "${VM_VMEM:-8192}"
      - --ssh-port
      - "2222"
      - --kvm
      # Rocjitsu emulated GPU.
      - --vfio-userdev
      - /run/vfu/rocjitsu.sock
      # PCI MMIO bridge: relays GPU doorbell writes to the NVMe BAR0.
      - --pci-mmio-bridge
      # One QEMU-emulated NVMe disk; appears as /dev/nvme0n1 in the guest.
      - --nvme
      - "${VM_NVME_COUNT:-1}"

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
