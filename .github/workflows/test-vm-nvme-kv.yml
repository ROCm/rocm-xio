---
# Build and test rocm-xio inside a VM that has a rocjitsu emulated AMD GPU
# attached over vfio-user, plus an SPDK NVMe controller (KV + LBA namespaces)
# also presented over vfio-user through the pci-mmio-bridge. This is the CI
# path that exercises the NVMe Key-Value command set end to end without
# physical hardware.
#
# Runs on every pull request into main, plus weekly and on demand. This is an
# expensive gate (full ROCm + DKMS provision plus emulated execution), so
# pushes to an open PR cancel the in-flight run rather than queueing behind it.
#
# Every image is pinned to a dated tag. Bump these deliberately; do not
# switch them to :latest.

name: rocm-xio - test-vm-nvme-kv

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ctest-label:
        description: ctest label regex to run inside the guest
        required: false
        default: "kv"
      skip-gpu:
        description: Skip GPU bring-up (build-only smoke run)
        required: false
        default: "0"
  schedule:
    # Weekly, off the hour so this does not pile onto every other cron job.
    - cron: '37 5 * * 2'

# A ~1h job on every push would otherwise pile up several runs deep on an
# actively worked PR. Only the tip of a branch is worth testing.
concurrency:
  group: test-vm-nvme-kv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Tags are <date>.g<ci-commit>-<component-commits>. The leading date alone
  # was not unique: the same date+component tag was re-pushed pointing at a new
  # digest, so a pin silently changed meaning under us. The .g<ci-commit> field
  # makes every rebuild a distinct tag. Never drop it, and never use :latest.
  #
  # SPDK: serves the NVMe KV (and optional LBA) namespace over vfio-user.
  # Built from mmgaggle/spdk@rados-nkv, not upstream spdk/spdk: the target-side
  # kvdev layer and nvmf_subsystem_add_kv_ns exist nowhere upstream.
  SPDK_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-spdk-libvfio-user:20260917.g857483b-spdk.18d1d8d

  # QEMU: MUST be the -sbates-fork repository: pci-mmio-bridge is not upstream.
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user-sbates-fork:20260918.g7438e48-qemu.7794baa-vfu.8039244

  # rocjitsu: the emulated AMD GPU served over vfio-user.
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260921.gb3399b3-rocjitsu.8e01a5a

  # Held one tag back on purpose: vfio_guest_firmware.py, the only source of
  # gfx1250 firmware blobs, was dropped from the image after this tag. Used
  # solely to synthesise firmware, never to serve the device.
  ROCJITSU_FIRMWARE_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260918.g7438e48-rocjitsu.20d4ce1

  # The "rocjitsu" flavour: carries ROCm userspace, amdgpu-dkms and
  # rocm-xio's build dependencies. MUST be the resolute build (see
  # test-vm-nvme.yml for the full explanation of why noble breaks here).
  #
  # MUST be the container-image format (no -qcow2 suffix): the action
  # extracts the guest disk via `docker create` + `docker cp /output/.`,
  # which requires a runnable container image. The -qcow2-suffixed tags
  # are OCI artifacts (schema_version 4) that docker create cannot run.
  QCOW2_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-rocjitsu:20260918.g7438e48-vm.resolute-rocjitsu-qm.5d68689

  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  SSH_PORT: "2222"

jobs:
  test-vm-nvme-kv:
    name: nvme-ep KV command set against an SPDK KV target
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out code.
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ansible
        run: python3 -m pip install ansible-core

      - name: Install host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cloud-image-utils \
            qemu-utils \
            rsync

      - name: Boot the rocjitsu + SPDK KV + NVMe VM
        id: vm
        uses: ./.github/actions/spdk-kv-nvme-vm
        with:
          spdk-image: ${{ env.SPDK_IMAGE }}
          qemu-image: ${{ env.QEMU_IMAGE }}
          rocjitsu-image: ${{ env.ROCJITSU_IMAGE }}
          qcow2-image: ${{ env.QCOW2_IMAGE }}
          images-dir: ${{ env.VM_IMAGES_DIR }}
          ssh-port: ${{ env.SSH_PORT }}
          vcpus: "4"
          vmem: "8192"
          shm-size: 12g

      - name: Provision ROCm, amdgpu and firmware in the guest
        env:
          SSH_PORT: ${{ steps.vm.outputs.ssh-port }}
          SSH_USER: ${{ steps.vm.outputs.ssh-user }}
          SSH_KEY: ${{ steps.vm.outputs.ssh-key }}
          ROCJITSU_IMAGE: ${{ env.ROCJITSU_IMAGE }}
          ROCJITSU_FIRMWARE_IMAGE: ${{ env.ROCJITSU_FIRMWARE_IMAGE }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ./scripts/test/vm-provision.sh

      - name: Copy the rocm-xio checkout into the guest
        env:
          SSH_PORT: ${{ steps.vm.outputs.ssh-port }}
          SSH_USER: ${{ steps.vm.outputs.ssh-user }}
          SSH_KEY: ${{ steps.vm.outputs.ssh-key }}
        run: |
          rsync -az --delete \
            --exclude /build --exclude /build-alola --exclude /.venv \
            -e "ssh -i $SSH_KEY -p $SSH_PORT \
                -o BatchMode=yes \
                -o NoHostAuthenticationForLocalhost=yes \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null" \
            ./ "$SSH_USER@localhost:rocm-xio/"

      - name: Build and run nvme-ep KV tests in the guest
        env:
          SSH_PORT: ${{ steps.vm.outputs.ssh-port }}
          SSH_USER: ${{ steps.vm.outputs.ssh-user }}
          SSH_KEY: ${{ steps.vm.outputs.ssh-key }}
          CTEST_LABEL: ${{ inputs.ctest-label || 'kv' }}
          SKIP_GPU: ${{ inputs.skip-gpu || '0' }}
          # kv-nsid is the integer NSID from the SPDK nsid map (e.g. "1");
          # the guest script discovers the controller device itself.
          KV_NSID: ${{ steps.vm.outputs.kv-nsid }}
        run: |
          ssh -i "$SSH_KEY" -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o NoHostAuthenticationForLocalhost=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$SSH_USER@localhost" \
              "CTEST_LABEL='$CTEST_LABEL' SKIP_GPU='$SKIP_GPU' \
               KV_NSID='$KV_NSID' \
               ./rocm-xio/scripts/test/vm-guest-test-kv.sh"

      - name: Cross-check SPDK stored the KV keys (host-side)
        working-directory: .github/compose/spdk-kv-nvme-vm
        env:
          SPDK_CONTAINER: spdk-kv-nvme-vm-spdk-nvme-1
        run: |
          # The guest has no Docker; run kvdev_mem_get_entry from the runner
          # where the SPDK container is directly accessible. This step
          # confirms the KV commands actually reached SPDK rather than
          # producing false-positive completions on the guest side.
          SPDK_CONTAINER="$SPDK_CONTAINER" \
            ./../../scripts/test/spdk-kv-check.sh

      - name: Collect guest diagnostics
        if: always()
        env:
          SSH_PORT: ${{ steps.vm.outputs.ssh-port }}
          SSH_USER: ${{ steps.vm.outputs.ssh-user }}
          SSH_KEY: ${{ steps.vm.outputs.ssh-key }}
        run: |
          mkdir -p artifacts
          ssh -i "$SSH_KEY" -p "$SSH_PORT" \
              -o BatchMode=yes -o ConnectTimeout=5 \
              -o NoHostAuthenticationForLocalhost=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@localhost" \
              'sudo dmesg' > artifacts/guest-dmesg.txt 2>&1 || true
          ssh -i "$SSH_KEY" -p "$SSH_PORT" \
              -o BatchMode=yes -o ConnectTimeout=5 \
              -o NoHostAuthenticationForLocalhost=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@localhost" \
              'cat rocm-xio/build/Testing/Temporary/LastTest.log' \
              > artifacts/ctest-last.log 2>&1 || true

      - name: Collect compose logs
        if: always()
        working-directory: .github/compose/spdk-kv-nvme-vm
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          docker compose logs --no-color \
            > "$GITHUB_WORKSPACE/artifacts/compose.log" 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-vm-nvme-kv-diagnostics
          path: artifacts/
          if-no-files-found: warn

      - name: Tear down the stack
        if: always()
        working-directory: .github/compose/spdk-kv-nvme-vm
        run: docker compose down --volumes --timeout 10 || true
