name: spell-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.md'
      - 'docs/**'
      - '.wordlist.txt'
      - '.spellcheck.yml'

jobs:
  spell-check:
    name: spell-check for rocm-xio
    runs-on: ubuntu-latest
    steps:
    - name: Check out code.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: GitHub Spellcheck Action
      uses: rojopolis/spellcheck-github-actions@dad57fc333130f4c9ae9632a6ad7ddc4de3515a2 # 0.69.0
