name: spell-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.md'
      - 'docs/**'
      - '.wordlist.txt'
      - '.spellcheck.yml'

jobs:
  spell-check:
    name: spell-check for rocm-xio
    runs-on: ubuntu-latest
    steps:
    - name: Check out code.
      uses: actions/checkout@v7.0.1
    - name: GitHub Spellcheck Action
      uses: rojopolis/spellcheck-github-actions@0.68.0
