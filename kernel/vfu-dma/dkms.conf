# DKMS configuration for the vfu-dma kernel module
#
# Binds to the vfu-doorbell ringer and provides /dev/vfu-dma: bus addresses from
# the DMA API for the vfu-ring tool.
#
# SPDX-License-Identifier: GPL-2.0-or-later

PACKAGE_NAME="vfu-dma"
PACKAGE_VERSION="#MODULE_VERSION#"

BUILT_MODULE_NAME[0]="vfu-dma"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"

MAKE="make -C ${kernel_source_dir} \
  M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
  modules"

CLEAN="make -C ${kernel_source_dir} \
  M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
  clean"
