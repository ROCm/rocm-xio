#
# Provision a booted rocm-xio test VM that is attached to a rocjitsu emulated
# GPU over vfio-user and has an emulated NVMe controller behind the QEMU
# pci-mmio-bridge.
#
# Derived from qemu-minimal's ansible/playbooks/vm-rocjitsu.yml, with two
# additions:
#
#   * The firmware inventory is *asserted* after it is generated, so a missing
#     blob fails here with a list of what is missing rather than hanging the
#     guest in gfx_v12_1_hw_init. The synthesis itself is the same
#     vfio_guest_firmware.py call qemu-minimal makes, because there is no
#     packaged alternative: no amdgpu release up to 31.50 ships gc_12_1_0 or
#     sdma_7_1_0, and neither does upstream linux-firmware.
#   * rocm-xio build dependencies are installed, since the point of the VM is
#     to build and test rocm-xio inside it.
#
# Driven by scripts/test/vm-provision.sh, which supplies the inventory.

- name: Provision a rocjitsu + NVMe rocm-xio test VM
  hosts: testvm
  become: true
  gather_facts: true
  vars:
    username: "{{ vm_username | default('batesste') }}"
    rocjitsu_image: "{{ lookup('env', 'ROCJITSU_IMAGE') }}"
    rocjitsu_firmware_image: >-
      {{ lookup('env', 'ROCJITSU_FIRMWARE_IMAGE')
         | default(rocjitsu_image, true) }}
    # Set false to provision the guest without demanding gfx1250 firmware,
    # which lets the NVMe half of the test run on its own.
    assert_gpu_firmware: true
    user_setup_motd: false
    user_setup_install_amd_ca: false
    user_setup_dotfiles_enable: false
    rocm_setup_user: "{{ username }}"
    rocm_setup_repo_stream: therock
    rocm_setup_minimal: true
    rocm_setup_minimal_packages:
      - libstdc++-14-dev
      - amdrocm-runtime-dev
    rocm_setup_skip_reboot: false
    rocm_setup_run_checks: true
    # The GPU is not attached until amdgpu is modprobed by hand against the
    # vfio-user device, so role-level GPU checks cannot pass here.
    rocm_setup_run_gpu_checks: false
    rocm_setup_install_metrics_exporter: false

  pre_tasks:
    # ROCm's own packages and Ubuntu universe ship colliding names; without
    # this the universe copies win and the ROCm runtime is subtly broken.
    - name: Pin ROCm-conflicting Ubuntu universe packages to never-install
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-no-distro-packages
        mode: '0644'
        content: |
          Package: rocminfo hipcc rocm-smi-lib libhsakmt1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime64-1 libhsa-runtime-dev libamdhip64-*
          Pin: release o=Ubuntu
          Pin-Priority: -1

    - name: Remove stale ROCm GPG keyrings and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/rocm.gpg
        - /etc/apt/keyrings/amdrocm.gpg
        - /etc/apt/sources.list.d/rocm.sources

  roles:
    - role: sbates130272.batesste.rocm_setup
      tags: [rocm_setup]

  tasks:
    - name: Purge stale distro ROCm runtime packages
      ansible.builtin.package:
        name:
          - libhsakmt1
          - libhsa-runtime64-1
          - libhsa-runtime-dev
        state: absent
        purge: true
      failed_when: false

    # amdgpu must not autoload: it has to be loaded by hand with the emulation
    # parameters once the vfio-user device is live.
    - name: Blacklist amdgpu autoload
      ansible.builtin.copy:
        dest: /etc/modprobe.d/amdgpu-blacklist.conf
        content: "blacklist amdgpu\n"
        mode: '0644'

    # ---------------------------------------------------------------------
    # Guest firmware: IP discovery table and gfx1250 stubs
    # ---------------------------------------------------------------------
    # The emulated device cannot produce the IP discovery table for itself.
    # Without it amdgpu polls BAR registers for a completion bit rocjitsu
    # never sets and spins at 99% CPU in gfx_v12_1_hw_init.
    #
    # The gfx1250 firmware blobs cannot come from a package: no amdgpu
    # release up to 31.50 ships gc_12_1_0 or sdma_7_1_0, and neither does
    # upstream linux-firmware. amdgpu-dkms-firmware, which amdgpu-dkms pulls
    # in, stops at gc_12_0_1. So the stubs rocjitsu generates are the only
    # source, which is what qemu-minimal's vm-rocjitsu.yml does too.
    #
    # Both generators live in the rocjitsu image, but not in every tag:
    # vfio_guest_firmware.py was dropped after rocjitsu.730bc62, so
    # rocjitsu_firmware_image is pinned separately from the image that
    # serves the device.
    - name: Create controller-side temp dir for generated firmware
      ansible.builtin.tempfile:
        state: directory
        prefix: rj_fw_
      register: rj_fw_tmp
      delegate_to: localhost
      become: false

    - name: Generate gfx1250 firmware stubs via the rocjitsu image
      ansible.builtin.command:
        cmd: >-
          docker run --rm -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_firmware_image }}
          python3 /usr/local/bin/vfio_guest_firmware.py --output /out
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Generate ip_discovery.bin via the pinned rocjitsu image
      ansible.builtin.command:
        cmd: >-
          docker run --rm -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_image }}
          rj-ip-discovery gfx1250 /out/ip_discovery.bin
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Ensure guest firmware directory exists
      ansible.builtin.file:
        path: /lib/firmware/amdgpu
        state: directory
        mode: '0755'

    - name: Install the generated firmware into the guest
      ansible.builtin.copy:
        src: "{{ rj_fw_tmp.path }}/"
        dest: /lib/firmware/amdgpu/
        mode: '0644'

    - name: Clean up controller-side temp dir
      ansible.builtin.file:
        path: "{{ rj_fw_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    # The gfx12.1 driver path asks for gc_12_1_0_mes.bin and _mes1.bin, which
    # the generator does not emit; the uni_mes stub stands in for both. Not
    # every rocjitsu tag emits uni_mes either, hence the stat guard.
    - name: Check whether the uni_mes stub was generated
      ansible.builtin.stat:
        path: /lib/firmware/amdgpu/gc_12_1_0_uni_mes.bin
      register: uni_mes_stat

    - name: Stand in for the older MES firmware paths with the uni_mes stub
      ansible.builtin.copy:
        src: /lib/firmware/amdgpu/gc_12_1_0_uni_mes.bin
        dest: /lib/firmware/amdgpu/{{ item }}
        remote_src: true
        mode: '0644'
      loop:
        - gc_12_1_0_mes.bin
        - gc_12_1_0_mes1.bin
      when: uni_mes_stat.stat.exists

    # ---------------------------------------------------------------------
    # KFD atomics
    # ---------------------------------------------------------------------
    # The emulated device cannot advertise PCIe atomics through the vfio-user
    # PCI capability, but KFD refuses a device without them. Assume support
    # when amdgpu_emu_mode is active.
    - name: Patch the KFD atomics check for emu_mode in the DKMS source
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          python3 - <<'PYEOF'
          import glob, sys
          srcs = sorted(glob.glob('/usr/src/amdgpu-*'))
          if not srcs:
              sys.exit('no amdgpu DKMS source found')
          path = srcs[-1] + '/amd/amdkfd/kfd_device.c'
          old = ('kfd->pci_atomic_requested = '
                 'amdgpu_amdkfd_have_atomics_support(kfd->adev);')
          new = ('kfd->pci_atomic_requested = '
                 'amdgpu_amdkfd_have_atomics_support(kfd->adev) || '
                 '(amdgpu_emu_mode == 1);')
          content = open(path).read()
          if new in content:
              print('already patched')
              sys.exit(0)
          if old not in content:
              sys.exit(f'target string not found in {path}')
          open(path, 'w').write(content.replace(old, new, 1))
          print(f'patched {path}')
          PYEOF
      register: atomics_patch
      changed_when: "'patched /' in atomics_patch.stdout"

    - name: Rebuild the amdgpu DKMS module after the atomics patch
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          VER=$(dkms status amdgpu | awk -F'[,/]' 'NR==1{gsub(/ /,"",$2); print $2}')
          dkms build amdgpu/"$VER" -k "$(uname -r)" --force
          dkms install amdgpu/"$VER" -k "$(uname -r)" --force
      when: atomics_patch.changed
      changed_when: true

    # ---------------------------------------------------------------------
    # Firmware inventory assertion
    # ---------------------------------------------------------------------
    # Ask the built module what it wants and check every blob is present, so
    # the failure names the missing files instead of hanging the guest in
    # gfx_v12_1_hw_init with nothing to go on.
    #
    # Two things this check has to get right, both learned the hard way:
    #   * amdgpu-dkms-firmware installs under /lib/firmware/updates/amdgpu,
    #     not /lib/firmware/amdgpu, so searching only the latter reports
    #     blobs missing that are in fact present and loadable.
    #   * modinfo lists the firmware for every ASIC the module supports, so
    #     matching on "mes" alone demands MES blobs for a dozen unrelated
    #     GPUs that are never loaded for this device. Match gfx1250 only.
    - name: Locate the built amdgpu.ko
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: modinfo -n amdgpu
      register: amdgpu_ko
      changed_when: false

    # The whole body is {% raw %} because bash's array-length syntax
    # ${#missing[@]} opens with "{#", which Jinja reads as a comment tag and
    # then fails to find the end of -- the task dies during argument
    # finalization, before anything runs. The module path arrives through the
    # environment rather than being templated in, so nothing here needs Jinja.
    - name: Assert every firmware blob amdgpu requests is present
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {% raw %}
          set -uo pipefail
          missing=()
          while read -r fw; do
            [ -n "$fw" ] || continue
            found=
            for d in /lib/firmware/updates /lib/firmware; do
              [ -e "$d/$fw" ] || [ -e "$d/$fw.xz" ] || continue
              found=1
              break
            done
            [ -n "$found" ] || missing+=("$fw")
          done < <(modinfo -F firmware "$AMDGPU_KO" \
                   | grep -E 'gc_12_1_0|sdma_7_1_0')
          if [ ${#missing[@]} -gt 0 ]; then
            echo "missing gfx1250 firmware blobs under /lib/firmware[/updates]:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "all requested gfx1250 firmware blobs present"
          {% endraw %}
      environment:
        AMDGPU_KO: "{{ amdgpu_ko.stdout }}"
      register: fw_check
      changed_when: false
      when: assert_gpu_firmware | bool

    - name: Show the firmware inventory result
      ansible.builtin.debug:
        var: fw_check.stdout_lines
      when: assert_gpu_firmware | bool

    # ---------------------------------------------------------------------
    # rocm-xio build dependencies
    # ---------------------------------------------------------------------
    - name: Install rocm-xio build and test dependencies
      ansible.builtin.package:
        name:
          - build-essential
          - cmake
          - git
          - libcli11-dev
          - libdrm-dev
          - nvme-cli
          - pciutils
          - python3-dev
          - rsync
        state: present
        update_cache: true

    - name: Install the ROCm BLAS dev package rocm-xio links against
      ansible.builtin.package:
        name: amdrocm-blas-dev
        state: present

    # Matches the modprobe line qemu-minimal's amdgpu-probe uses; kept here so
    # the guest can be brought up by hand the same way CI does it.
    - name: Install the amdgpu-probe helper
      ansible.builtin.copy:
        dest: /usr/local/bin/amdgpu-probe
        mode: '0755'
        content: |
          #!/bin/bash
          # Probe amdgpu against the rocjitsu emulated gfx1250 device.
          # Run only once the vfio-user server is serving.
          exec modprobe amdgpu \
            emu_mode=1 \
            fw_load_type=0 \
            discovery=2 \
            ip_block_mask=0x3f \
            vm_update_mode=3 \
            gpu_recovery=0 \
            vramlimit=256

    - name: Allow the test user passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-rocm-xio-ci
        mode: '0440'
        validate: visudo -cf %s
        content: "{{ username }} ALL=(ALL) NOPASSWD:ALL\n"
