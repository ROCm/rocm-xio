spellchecker: aspell
matrix:
- name: markdown
  aspell:
    lang: en
  sources:
  - '*.md'
  - 'src/**/*.md'
  - 'scripts/**/*.md'
  pipeline:
  - pyspelling.filters.markdown
  - pyspelling.filters.html:
      comments: false
      attributes: []
      ignore_tags:
      - code
      - pre
  dictionary:
    wordlists:
    - .wordlist.txt
    encoding: utf-8
  default_encoding: utf-8
  expect_match: true
- name: restructuredtext
  aspell:
    lang: en
  sources:
  - 'docs/**/*.rst'
  pipeline:
  - pyspelling.filters.text
  dictionary:
    wordlists:
    - .wordlist.txt
    encoding: utf-8
  default_encoding: utf-8
  expect_match: true
